[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybluetti"
version = "0.1.0"
description = "Async Python client for the BLUETTI cloud API - device discovery, state, and control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "chpego" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/chpego/pybluetti"
"Used by" = "https://github.com/bluetti-official/bluetti-home-assistant"
Issues = "https://github.com/chpego/pybluetti/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "aioresponses",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pybluetti"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter-incompatible / removed rules.
    "D203", # no-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter

    # Same "ratchet up over time rather than one giant mechanical PR"
    # bootstrap baseline used in bluetti-home-assistant's own ruff.toml -
    # keep this list only as large as what a fresh, empty package actually
    # needs; grow it deliberately as code lands, not preemptively.
    "D1", # undocumented-* - matches "no comment unless the why is non-obvious"
    "CPY001", # missing-copyright-notice - a top-level LICENSE file covers this

    # Deliberately NOT bootstrapped away like bluetti-home-assistant's ANN
    # ignores: that codebase predates strict typing and ratchets up over
    # time, but this one starts from zero, and reaching HA core eventually
    # needs "strict-typing: done" - so annotations are required from the
    # first commit instead of being deferred.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the normal pytest idiom, not a smell, here.
